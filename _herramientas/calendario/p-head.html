  {"@type": "Question", "name": "¿Cuántos festivos hay en 2027?", "acceptedAnswer": {"@type": "Answer", "text": "Cada comunidad tiene 12 festivos en 2027 (Canarias, 11 más la fiesta de cada isla), y a ellos se suman 2 fiestas locales de cada municipio. Ocho son iguales en toda España: 1 de enero, Viernes Santo, 1 de mayo, 12 de octubre, 1 de noviembre y 6, 8 y 25 de diciembre. El 6 de enero también lo tienen todas las comunidades."}},
  {"@type": "Question", "name": "¿Cuándo es Semana Santa en 2027?", "acceptedAnswer": {"@type": "Answer", "text": "En 2027 la Semana Santa es pronto: el Jueves Santo es el 25 de marzo, el Viernes Santo el 26 y el Domingo de Pascua el 28. El Lunes de Pascua, 29 de marzo, es festivo en Baleares, Cataluña, Navarra, País Vasco, La Rioja y la Comunitat Valenciana."}},
  {"@type": "Question", "name": "¿Cuál es el mejor puente de 2027?", "acceptedAnswer": {"@type": "Answer", "text": "El de diciembre: el 6 cae en lunes y el 8 en miércoles. Si pides solo el martes 7, descansas del sábado 4 al miércoles 8, y con el jueves 9 y el viernes 10 enlazas 9 días seguidos gastando 3 de vacaciones."}},
